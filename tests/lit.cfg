# -*- Python -*-
import os
import sys
import re
import platform
try:
   import lit.util
   import lit.formats
except ImportError:
   pass
# Add current path to be able to include clam_config
script_dir = os.path.dirname(os.path.realpath(__file__))
sys.path.append(script_dir)

config.name = 'Clam'

config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = ['.c', '.crab']
   
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = lit_config.params.get('test_dir', '.')

def addEnv(name):
   if name in os.environ:
      config.environment[name] = os.environ[name]

def isexec (fpath):
    if fpath == None: return False
    return os.path.isfile(fpath) and os.access(fpath, os.X_OK)

def which(program):
   if isinstance (program, str): 
      choices = [program]
   else:
      choices = program
   for p in choices:
      fpath, fname = os.path.split(p)
      if fpath:
         if isexec (p): return p
      else:
         for path in os.environ["PATH"].split(os.pathsep):
            exe_file = os.path.join(path, p)
            if isexec (exe_file):
               return exe_file
   return None

def getClam ():
   clam = None
   # CMake passes the install prefix of *this* build via the 'clam_dir' param
   # (see tests/CMakeLists.txt) and it deliberately outranks both $CLAM and
   # PATH: the suite exists to test the build it was configured from, and a
   # clam built against a different LLVM (e.g. a clam14 checkout exported in
   # $CLAM or on PATH) cannot read the bitcode produced here, which silently
   # turns every test red. The lookups below still apply when it is unset.
   clam_dir = lit_config.params.get('clam_dir', '')
   if clam_dir:
      clam = os.path.join(clam_dir, 'clam.py')
   if not isexec (clam) and 'CLAM' in os.environ and os.path.isdir(os.environ ['CLAM']):
      clam = os.path.join(os.environ ['CLAM'],'clam.py')
   if not isexec (clam):
      clam = os.path.join (repositoryRoot, 'build', 'run', 'bin', 'clam.py')
   if not isexec (clam):
      clam = which ('clam.py')
   return clam

addEnv('HOME')
addEnv('PWD')
addEnv('C_INCLUDE_PATH')

repositoryRoot = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
lit_config.note('Repository root is {}'.format(repositoryRoot))

# Each test compiles a C input to bitcode with clang and then feeds it to
# clam-pp/clam, so that clang MUST match the LLVM release the tools were built
# against (CLAM_LLVM_VERSION): a newer clang (e.g. Apple clang) emits bitcode
# the tools cannot read, which makes every test fail. CMake locates a
# matching clang and passes its directory via the 'clang_dir' param (see
# tests/CMakeLists.txt); put it first on PATH so both which() below and
# clam.py's own clang lookup pick it up instead of the system clang.
config.environment['PATH'] = os.environ.get('PATH', '')
clang_dir = lit_config.params.get('clang_dir', '')
if clang_dir:
   os.environ['PATH'] = clang_dir + os.pathsep + os.environ.get('PATH', '')
   config.environment['PATH'] = os.environ['PATH']
   lit_config.note('Using clang from {}'.format(clang_dir))

lit_config.note('Found clang: {}'.format(which('clang')))

clam_cmd = getClam()
if not isexec(clam_cmd):
   lit_config.fatal('Could not find the clam executable')
else:
   lit_config.note('Found clam.py: {}'.format(clam_cmd))

config.substitutions.append(('%clam', clam_cmd))

llvm_dis_cmd = which('llvm-dis')
if llvm_dis_cmd is None:
   lit_config.fatal('Could not find llvm-dis')
else:
   lit_config.note('Found llvm-dis: {}'.format(llvm_dis_cmd))

config.substitutions.append(('%llvm_dis', llvm_dis_cmd))
