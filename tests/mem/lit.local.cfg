# -*- Python -*-

import clam_config

config.excludes = []

# These tests use the polyhedra (pk) domain, which is only available when Crab
# is built with one of the Apron / PPLite / Elina backends.
if (clam_config.use_apron == "OFF" and clam_config.use_pplite == "OFF"
        and clam_config.use_elina == "OFF"):
    config.excludes += ['test-mem-15.c', 'transfer-lamports.c',
                        'transfer-lamports-2.c']
