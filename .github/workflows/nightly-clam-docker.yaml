# Nightly: build master and every maintained dev<N> branch, and push the dev
# images to DockerHub.
#
# The branch list is discovered at run time from the repository itself:
#   - master, and
#   - every branch whose name is *exactly* dev<N> (nothing before, nothing
#     after) with N >= 14.
# So dev15 and dev16 are built, while dev13, dev14-decoupling, dev10-dyn-link
# and anything else are not. Cutting a new dev16/dev17/... branch is therefore
# enough -- this file never needs an edit.
#
# master is built but never pushed; it only guards against master rotting.
# dev<N> is built with LLVM_VERSION=<N> and pushed as seahorn/clam-llvm<N>:nightly.
#
# NOTE: scheduled workflows only run from the repository's default branch, so
# this file must be present there for the cron to fire.

name: Nightly

# Controls when the action will run.
on:
  # Triggers the workflow nightly for every branch discovered below.
  schedule:
    - cron: 0 0 * * *  # run every day at UTC 00:00
  workflow_dispatch:
    inputs:
      Triggerer:
        description: 'Triggered by:'
        required: true
        default: ''

jobs:
  # Discover which branches to build and turn them into a matrix.
  branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: List master and every dev<N> branch (N >= 14)
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # '^dev[0-9]+$' is anchored at both ends, so only a bare dev<N> matches:
          # dev14, dev15, dev16, ... are kept, while dev14-decoupling,
          # dev10-dyn-link, devfoo, mydev15 and the like are all rejected.
          # awk then keeps N >= 14 and sort -n orders oldest release first.
          devs=$(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate --jq '.[].name' \
                 | grep -E '^dev[0-9]+$' \
                 | sed 's/^dev//' \
                 | awk '$1 >= 14' \
                 | sort -n)
          # master carries no llvm field: its Dockerfile pins its own LLVM
          # release, so we pass no build args and let those defaults win.
          matrix=$(jq -nc --arg devs "$devs" '
            [{ref: "master", llvm: "", image: "clam:master", push: false}]
            + ($devs | split("\n") | map(select(length > 0)) | map({
                ref:   ("dev" + .),
                llvm:  .,
                image: ("seahorn/clam-llvm" + . + ":nightly"),
                push:  true
              }))')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: branches
    name: ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      # Keep building the other branches even if one of them fails.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.branches.outputs.matrix) }}

    steps:
      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Build clam and run tests (${{ matrix.ref }})
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ matrix.llvm }}" ]; then
            # dev15+ derives the base image from LLVM_VERSION; dev14 predates
            # that arg and only understands BASE_IMAGE. Passing both keeps this
            # workflow working across the old and the new Dockerfile.
            args+=(--build-arg "LLVM_VERSION=${{ matrix.llvm }}")
            args+=(--build-arg "BASE_IMAGE=jammy-llvm${{ matrix.llvm }}")
          fi
          docker build "${args[@]}" \
            -t ${{ matrix.image }} \
            -f docker/clam.Dockerfile .

      # Logging in using this mechanism prints the following warning
      # WARNING! Your password will be stored unencrypted in /home/runner/.docker/config.json.
      # There does not seem to be an easy way around it though using docker actions may mitigate
      # it.
      - name: Login to DockerHub Registry
        # only push dev<N> images, and only on the nightly run
        if: ${{ matrix.push && github.event_name == 'schedule' }}
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Tag and push clam (nightly)
        if: ${{ matrix.push && github.event_name == 'schedule' }}
        run: |
          docker push ${{ matrix.image }}
